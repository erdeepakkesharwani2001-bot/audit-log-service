# Development Profile Configuration
spring.config.activate.on-profile=dev

# Server Configuration
server.port=8080

# DataSource Configuration (H2 for rapid development)
spring.datasource.url=jdbc:h2:mem:audit_log_dev
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.schwab.audit=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# Security - JWT Configuration (use default for dev)
app.jwt.secret=devSecretKeyForDevelopmentChangeInProduction12345678901234567890
app.jwt.expiry-hours=24

# Disable HTTPS requirement in development
server.ssl.enabled=false
