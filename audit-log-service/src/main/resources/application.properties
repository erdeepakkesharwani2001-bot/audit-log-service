# Application Configuration
spring.application.name=audit-log-service
spring.application.description=Tamper-Evident Audit Log Service

# Server Configuration
server.port=8282
server.servlet.context-path=/
server.error.include-message=always
server.error.include-stacktrace=never

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# DataSource Configuration (H2 - embedded database)
spring.datasource.url=jdbc:h2:mem:audit_log_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-suffixes=.sql

# Logging Configuration
logging.level.root=INFO
logging.level.com.schwab.audit=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security - JWT Configuration
app.jwt.secret=${JWT_SECRET:defaultSecretKeyChangeInProduction12345678901234567890}
app.jwt.expiry-hours=24
app.jwt.algorithm=HS256

# Security - Password Encoder Configuration
app.security.password-encoder-strength=12

# Audit Retention Configuration
app.audit.retention.days=365
app.audit.retention.policy=ARCHIVE
app.audit.retention.archive-schedule-cron=0 0 2 * * ?

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.show-extension=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

