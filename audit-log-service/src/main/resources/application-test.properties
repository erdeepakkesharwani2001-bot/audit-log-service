# Test Profile Configuration
spring.config.activate.on-profile=test

# Server Configuration
server.port=0

# DataSource Configuration (H2 for fast testing)
spring.datasource.url=jdbc:h2:mem:audit_log_test;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration (Minimal for tests)
logging.level.root=WARN
logging.level.com.schwab.audit=DEBUG
logging.level.org.springframework.test=INFO

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# Security - JWT Configuration
app.jwt.secret=testSecretKeyForTestingChangeInProduction12345678901234567890
app.jwt.expiry-hours=24

# Disable HTTPS requirement in tests
server.ssl.enabled=false
